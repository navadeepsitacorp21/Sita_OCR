services:
  # ── Backend: FastAPI + RapidOCR ─────────────────────────────────────────────
  - type: web
    name: sita-ocr-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 5
    envVars:
      - key: WEB_CONCURRENCY
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: ENV
        value: production
      - key: DEBUG
        value: false
      - key: OCR_PROVIDER
        value: rapidocr
      - key: OCR_ENABLE_FALLBACK
        value: false
      - key: OCR_TIMEOUT_SECONDS
        value: "60"
      # SQLite stored on the persistent disk — survives deploys
      - key: DATABASE_URL
        value: sqlite:////data/health_vault.db
      # Set ALLOWED_ORIGINS after you know the frontend URL.
      # Example: https://sita-ocr-frontend.onrender.com
      # You can also set this in the Render dashboard after the frontend is deployed.
      - key: ALLOWED_ORIGINS
        value: ""   # fill in after first deploy

  # ── Frontend: React/Vite SPA ────────────────────────────────────────────────
  - type: web
    name: sita-ocr-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # SPA fallback: all paths serve index.html so React Router works
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Set this to your backend's Render URL before building.
      # Example: https://sita-ocr-backend.onrender.com/api/v1
      - key: VITE_API_BASE_URL
        value: ""   # fill in with the sita-ocr-backend service URL + /api/v1

